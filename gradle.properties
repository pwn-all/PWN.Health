# Both daemons get 3 GB of their own. With Gradle's 2 GB inherited, the Kotlin daemon's JVM backend
# runs out of heap mid-codegen ("Not enough memory to run compilation") with lint and tests in one
# run. Two 3 GB heaps leave room on GitHub's hosted runners.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx3g
# Off by default for CodeQL: its autobuild extracts code by watching the compiler run, and a
# compileKotlin served from a cache gives it nothing to see. The build workflow passes
# --build-cache itself.
org.gradle.caching=false
android.useAndroidX=true
kotlin.code.style=official
# Print every Gradle deprecation instead of the one-line "deprecated features were used" summary.
#
# Not `fail`, which is what the rest of this build does with a warning: a deprecated call the
# Android Gradle plugin makes while it is being applied, before any build script gets a say, would
# fail every build with nothing here able to fix it. `./gradlew help` prints any such warning.
org.gradle.warning.mode=all
